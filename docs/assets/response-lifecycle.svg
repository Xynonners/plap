<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">How a review continues across requests</title>
  <desc id="desc">A user message starts the main model, which calls a server tool and produces a draft. An advisor plugin holds the draft, calls an advisor model, and asks the client to run a tool. The first API request saves both threads. A second request restores them, appends the tool result to the advisor thread, finishes review, and returns advice to the main model before the final answer.</desc>
  <defs>
    <marker id="black-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#151515"/>
    </marker>
    <marker id="orange-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#ff5a00"/>
    </marker>
    <style>
      .heading { fill: #151515; font: 750 24px Arial, Helvetica, sans-serif; }
      .track { fill: #151515; font: 750 13px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; }
      .event { fill: #151515; font: 700 13px Arial, Helvetica, sans-serif; }
      .event-orange { fill: #d94d00; font: 700 13px Arial, Helvetica, sans-serif; }
      .body { fill: #6f6d67; font: 500 12px Arial, Helvetica, sans-serif; }
      .note { fill: #6f6d67; font: 650 10px Arial, Helvetica, sans-serif; letter-spacing: 0.8px; }
      .request { fill: #151515; font: 750 11px Arial, Helvetica, sans-serif; letter-spacing: 1.2px; }
      .core { fill: none; stroke: #151515; stroke-width: 1.7; stroke-linecap: square; stroke-linejoin: miter; }
      .plugin { fill: none; stroke: #ff5a00; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
      .guide { fill: none; stroke: #d7d4cc; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#f7f6f2"/>

  <text x="40" y="48" class="heading">How a review continues across requests</text>
  <text x="40" y="72" class="body">The advisor holds a draft, asks the client to run a tool, then resumes when the client returns the result.</text>
  <path d="M40 92H1160" class="guide"/>

  <!-- Request spans -->
  <path d="M170 120V108H750V120" class="core"/>
  <text x="460" y="101" text-anchor="middle" class="request">REQUEST</text>
  <path d="M810 120V108H1150V120" class="core"/>
  <text x="980" y="101" text-anchor="middle" class="request">CONTINUATION</text>
  <path d="M780 98V590" stroke="#ff5a00" stroke-width="1.5" stroke-dasharray="5 7"/>
  <text x="780" y="610" text-anchor="middle" class="note" fill="#d94d00">REQUEST BOUNDARY</text>

  <!-- Track labels and guides -->
  <text x="40" y="172" class="track">CLIENT</text>
  <text x="40" y="292" class="track">MAIN</text>
  <text x="40" y="432" class="track">ADVISOR</text>
  <text x="40" y="562" class="track">STATE</text>
  <path d="M150 168H1150M150 288H1150M150 428H1150M150 558H1150" class="guide"/>

  <!-- User starts main -->
  <circle cx="190" cy="168" r="5" fill="#151515"/>
  <text x="190" y="148" text-anchor="middle" class="event">User message</text>
  <path d="M190 174V282" class="core" marker-end="url(#black-arrow)"/>
  <circle cx="190" cy="288" r="6" fill="#f7f6f2" stroke="#151515" stroke-width="2"/>
  <text x="210" y="270" class="event">Main model</text>

  <!-- Server tool loop -->
  <path d="M196 288H326" class="core" marker-end="url(#black-arrow)"/>
  <rect x="334" y="282" width="12" height="12" fill="#ff5a00"/>
  <text x="340" y="270" text-anchor="middle" class="event-orange">Server tool</text>
  <path d="M346 288C378 288 380 360 414 360H446C472 360 476 320 476 294" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="476" cy="288" r="6" fill="#f7f6f2" stroke="#151515" stroke-width="2"/>
  <text x="476" y="270" text-anchor="middle" class="event">Main model</text>
  <path d="M482 288H554" class="core" marker-end="url(#black-arrow)"/>
  <circle cx="562" cy="288" r="5" fill="#151515"/>
  <text x="562" y="270" text-anchor="middle" class="event">Draft</text>

  <!-- Advisor holds draft and requests client tool -->
  <path d="M562 294V352C562 390 590 428 620 428" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="628" cy="428" r="6" fill="#f7f6f2" stroke="#ff5a00" stroke-width="2.5"/>
  <text x="628" y="456" text-anchor="middle" class="event-orange">Review model</text>
  <path d="M634 428H710" class="plugin" marker-end="url(#orange-arrow)"/>
  <rect x="718" y="422" width="12" height="12" fill="#ff5a00"/>
  <text x="708" y="402" text-anchor="end" class="event-orange">Client tool call</text>
  <path d="M724 422V174" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="724" cy="168" r="5" fill="#ff5a00"/>
  <text x="724" y="148" text-anchor="middle" class="event-orange">Run tool</text>

  <!-- Save and restore at request boundary -->
  <path d="M730 428C748 460 750 512 750 552" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="750" cy="558" r="5" fill="#ff5a00"/>
  <text x="734" y="540" text-anchor="end" class="event-orange">Save both threads</text>
  <path d="M755 558H838" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="846" cy="558" r="5" fill="#ff5a00"/>
  <text x="862" y="540" class="event-orange">Restore both threads</text>
  <text x="862" y="580" class="body">main remains held; advisor completes first</text>

  <!-- Client returns tool output -->
  <path d="M724 168H846" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="854" cy="168" r="5" fill="#ff5a00"/>
  <text x="854" y="148" text-anchor="middle" class="event-orange">Tool result</text>
  <path d="M854 174V422" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="854" cy="428" r="6" fill="#f7f6f2" stroke="#ff5a00" stroke-width="2.5"/>
  <text x="870" y="402" class="event-orange">Append tool result</text>
  <path d="M860 428H930" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="938" cy="428" r="6" fill="#f7f6f2" stroke="#ff5a00" stroke-width="2.5"/>
  <text x="938" y="456" text-anchor="middle" class="event-orange">Review model</text>

  <!-- Advice returns to main, then final output -->
  <path d="M944 428H988V296" class="plugin" marker-end="url(#orange-arrow)"/>
  <circle cx="988" cy="288" r="6" fill="#f7f6f2" stroke="#151515" stroke-width="2"/>
  <text x="988" y="270" text-anchor="middle" class="event">Main revises</text>
  <path d="M994 288H1090" class="core" marker-end="url(#black-arrow)"/>
  <circle cx="1098" cy="288" r="5" fill="#151515"/>
  <text x="1112" y="270" class="event">Final answer</text>
  <path d="M1098 282V174" class="core" marker-end="url(#black-arrow)"/>
  <circle cx="1098" cy="168" r="5" fill="#151515"/>
  <text x="1098" y="148" text-anchor="middle" class="event">Returned</text>

  <!-- Legend -->
  <path d="M40 618H92" class="plugin"/>
  <text x="104" y="622" class="note">WORK ADDED BY PLUGINS</text>
</svg>
